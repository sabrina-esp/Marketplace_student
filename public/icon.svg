<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="256" cy="256" r="256" fill="url(#grad1)"/>
  
  <!-- Icon design - Book with graduation cap -->
  <g transform="translate(256, 256)">
    <!-- Book -->
    <rect x="-80" y="-40" width="160" height="120" rx="10" fill="white" opacity="0.95"/>
    <rect x="-80" y="-40" width="160" height="120" rx="10" fill="none" stroke="white" stroke-width="4"/>
    <line x1="0" y1="-40" x2="0" y2="80" stroke="#7c3aed" stroke-width="6"/>
    
    <!-- Pages -->
    <line x1="-60" y1="-10" x2="60" y2="-10" stroke="#8b5cf6" stroke-width="4" opacity="0.6"/>
    <line x1="-60" y1="10" x2="60" y2="10" stroke="#8b5cf6" stroke-width="4" opacity="0.6"/>
    <line x1="-60" y1="30" x2="60" y2="30" stroke="#8b5cf6" stroke-width="4" opacity="0.6"/>
    
    <!-- Graduation cap -->
    <g transform="translate(0, -100)">
      <polygon points="-60,-20 0,-40 60,-20 60,0 -60,0" fill="#fbbf24"/>
      <rect x="-8" y="0" width="16" height="50" fill="#fbbf24"/>
      <circle cx="0" cy="50" r="10" fill="#fbbf24"/>
      <line x1="10" y1="50" x2="30" y2="70" stroke="#fbbf24" stroke-width="4"/>
      <circle cx="30" cy="70" r="6" fill="#ef4444"/>
    </g>
  </g>
</svg>
